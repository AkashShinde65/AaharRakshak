# AaharRakshak Render Blueprint draft.
# Planning artifact only: do not create/sync this Blueprint without user approval.
# Secret values use sync:false or generateValue and must be supplied in Render.

previews:
  generation: off

services:
  - type: keyvalue
    name: aaharrakshak-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: aaharrakshak-api
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: off
    dockerfilePath: ./backend-spring/Dockerfile
    dockerContext: ./backend-spring
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "10000"
      - key: PUBLIC_BASE_URL
        value: https://aaharrakshak-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://aaharrakshak-portal.onrender.com
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: aaharrakshak-redis
          property: connectionString
      - key: MAX_FILE_SIZE
        value: 10MB
      - key: MAX_REQUEST_SIZE
        value: 25MB
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "120"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: ERROR_METRICS_ENABLED
        value: "true"
      - key: ACCESS_TOKEN_MINUTES
        value: "20"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: MAX_LOGIN_ATTEMPTS
        value: "5"
      - key: LOCK_MINUTES
        value: "15"
      - key: HOTSPOT_RADIUS_KM
        value: "2.0"
      - key: HOTSPOT_WINDOW_HOURS
        value: "24"
      - key: HOTSPOT_CRITICAL_THRESHOLD
        value: "10"
      - key: HIGH_RISK_THRESHOLD
        value: "70"
      - key: HIGH_RISK_SLA_HOURS
        value: "48"

  - type: web
    name: aaharrakshak-portal
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: off
    dockerfilePath: ./official-web-dotnet/Dockerfile
    dockerContext: ./official-web-dotnet
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: AaharRakshakApi__BaseUrl
        value: https://aaharrakshak-api.onrender.com
