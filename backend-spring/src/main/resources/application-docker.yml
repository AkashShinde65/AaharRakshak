spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:aaharrakshak}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:aahar}
    password: ${DB_PASSWORD:aahar_password}

management:
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    jwt-secret: ${JWT_SECRET}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5080,http://localhost:8080,http://10.0.2.2:8080}
