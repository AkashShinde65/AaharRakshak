spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}

server:
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  public-base-url: ${PUBLIC_BASE_URL}
  security:
    jwt-secret: ${JWT_SECRET}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
    rate-limit:
      enabled: true
      max-requests: ${RATE_LIMIT_MAX_REQUESTS:120}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  integrations:
    identity-verification: mock
    licence-registry: mock
    notifications: mock
