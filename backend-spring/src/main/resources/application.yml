spring:
  application:
    name: aaharrakshak-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aaharrakshak}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:aahar}
    password: ${DB_PASSWORD:aahar_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:1s}
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  security:
    jwt-secret: ${JWT_SECRET:aahar-rakshak-development-secret-change-before-production-2026}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:20}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:7}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lock-minutes: ${LOCK_MINUTES:15}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5080,http://localhost:8080,http://10.0.2.2:8080}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      max-requests: ${RATE_LIMIT_MAX_REQUESTS:120}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  integrations:
    identity-verification: mock
    licence-registry: mock
    notifications: mock
  monitoring:
    error-metrics-enabled: ${ERROR_METRICS_ENABLED:true}
  intelligence:
    hotspot-radius-km: ${HOTSPOT_RADIUS_KM:2.0}
    hotspot-window-hours: ${HOTSPOT_WINDOW_HOURS:24}
    hotspot-critical-threshold: ${HOTSPOT_CRITICAL_THRESHOLD:10}
    high-risk-threshold: ${HIGH_RISK_THRESHOLD:70}
    high-risk-sla-hours: ${HIGH_RISK_SLA_HOURS:48}
    review-rate-limit-minutes: ${REVIEW_RATE_LIMIT_MINUTES:60}
