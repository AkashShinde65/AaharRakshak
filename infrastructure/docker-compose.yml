services:
  mysql:
    image: mysql:8.4
    container_name: aaharrakshak-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-aaharrakshak}
      MYSQL_USER: ${DB_USERNAME:-aahar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-aahar_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aaharrakshak-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: aaharrakshak-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aaharminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aahar_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ../backend-spring
    container_name: aaharrakshak-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-aaharrakshak}
      DB_USERNAME: ${DB_USERNAME:-aahar}
      DB_PASSWORD: ${DB_PASSWORD:-aahar_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-compose-secret-before-production-2026}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080,http://10.0.2.2:8080}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      ERROR_METRICS_ENABLED: ${ERROR_METRICS_ENABLED:-true}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-25MB}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  official-web:
    build:
      context: ../official-web-dotnet
    container_name: aaharrakshak-official-web
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      AaharRakshakApi__BaseUrl: http://backend-api:8080
    ports:
      - "5080:8080"
    depends_on:
      - backend-api

  frontend-react:
    build:
      context: ../frontend-react
      dockerfile: Dockerfile
    container_name: aaharrakshak-react
    ports:
      - "5173:80"
    depends_on:
      - backend-api
    restart: unless-stopped

volumes:
  mysql-data:
  minio-data:
